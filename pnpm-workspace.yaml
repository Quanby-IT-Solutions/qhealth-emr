packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # The Better Auth CLI (`pnpm auth:generate`). Keep it on the same version as better-auth.
  auth: 1.7.15
  "@eslint/js": ^9.39.2
  "@nestjs/common": ^11.2.7
  "@nestjs/core": ^11.2.7
  "@orpc/contract": ^1.15.7
  "@orpc/nest": ^1.15.7
  "@sentry/nestjs": ^10.70.0
  "@sentry/nextjs": 10.75.2
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/eslint-plugin-query": ^5.91.2
  "@tanstack/react-form": ^1.27.7
  "@tanstack/react-query": ^5.90.16
  "@t3-oss/env-core": ^0.13.10
  "@t3-oss/env-nextjs": ^0.13.10
  "@turbo/gen": ^2.11.9
  "@types/node": ^22.19.3
  "@types/pg": ^8.16.0
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  better-auth: 1.7.15
  dotenv: ^16.6.1
  drizzle-orm: 1.0.0-beta.20
  eslint: ^9.39.2
  nestjs-zod: ^5.1.1
  next: 16.4.5
  pg: ^8.16.3
  prettier: ^3.7.4
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4.3.3
  tsx: ^4.21.0
  turbo: ^2.11.9
  typescript: ^5.9.3
  typescript-eslint: ^8.52.0
  zod: 4.6.6

catalogs:
  react19:
    "@types/react": ^19.2.7
    "@types/react-dom": ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@scarf/scarf"
  - "@swc/core"
  - argon2
  - better-sqlite3
  - core-js-pure
  - esbuild
  - grpc-tools
  - sharp
  - unrs-resolver

overrides:
  "@types/minimatch": 5.1.2
  "@types/mssql": "-"
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "argparse@>=1 <2>sprintf-js": "-"
  "gel": "-"
  "@graphql-tools/utils@<12.0.1": ">=12.0.1 <13"
  "handlebars@<4.7.10": ">=4.7.10 <5"
  "mssql": "-"
  "proxy-addr@<2.0.8": ">=2.0.8 <3"
  "picomatch@>=4 <4.0.4": ">=4.0.4 <5"
  "ajv@>=8 <8.18.0": ">=8.18.0 <9"
  "lodash@>=4 <4.18.0": ">=4.18.0 <5"
  "js-yaml@>=5 <5.4.1": ">=5.4.1 <5.5.0"
  "http-cache-semantics@<4.3.0": ">=4.3.0 <5"
  # No @nestjs/platform-express release depends on multer >=2.5.0 (11.2.8 and
  # 12.2.0 both pin 2.4.0). Express 5.3.0 still accepts body-parser ^2.3.0, so
  # a parent bump does not force both floors.
  "body-parser@<2.4.0": ">=2.4.0 <3"
  "multer@<2.5.0": ">=2.5.0 <3"
  # @serwist/build and @serwist/turbopack 9.5.13 (latest) depend on zod 4.6.5.
  # @better-auth/core and eslint-plugin-react-hooks accept zod 4.x below 4.6.6,
  # and no current parent release raises that floor. Replaces drizzle-orm>zod 4.3.5.
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  # The override below replaces @next/eslint-plugin-next's fast-glob with
  # tinyglobby. While it is in place, settings.next.rootDir must be a wildcard
  # pattern (e.g. "apps/*/"): a literal path makes the replacement scan the
  # whole tree. Remove this override once @next/eslint-plugin-next stops
  # pinning fast-glob 3.3.1, or when upstream ships a fix, and re-run lint
  # after removing it.
  "@next/eslint-plugin-next>fast-glob": "npm:tinyglobby@^0.2.15"
  # Dependabot remediation (2026-11): pin transitive deps onto their patched
  # releases. Each override is scoped to the advisory's vulnerable range so an
  # already-fixed resolution is left alone. Drop an entry once every parent
  # naturally resolves at or above the patched version.
  "minimatch@<3.1.3": ">=3.1.3 <4"
  "minimatch@>=7 <11.0.1": ">=11.0.1 <12"
  # Funnel vulnerable glob ranges onto the two locally patched releases
  # (see patchedDependencies below) instead of the cross-major 14.0.2 fix.
  "glob@>=10.2.0 <10.5.0": "10.5.0"
  "glob@>=13.0.0 <14": "13.0.6"
  "qs@>=6.7.0 <6.16.1": ">=6.16.1 <7"
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4"
  "fast-xml-parser@>=5 <5.12.0": ">=5.12.0 <6"
  # Unscoped: vitest declares `^6 || ^7 || ^8`, which a range-scoped selector
  # cannot match. Every vite in the tree is 8.x, so this floor is safe.
  "vite": ">=8.1.6 <9"
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  "brace-expansion@<1.1.21": ">=1.1.21 <2"
  "brace-expansion@>=2.0.0 <2.1.7": ">=2.1.7 <3"
  "piscina@<4.9.4": ">=4.9.4 <5"
  "js-yaml@>=3 <3.15.2": ">=3.15.2 <4"
  "js-yaml@>=4 <4.3.2": ">=4.3.2 <5"
  "browserslist@<4.28.7": ">=4.28.7 <5"
  "fflate@<0.8.3": ">=0.8.3 <0.9"
  "@humanfs/node@<0.16.8": ">=0.16.8 <0.17"
  "@babel/core@<7.29.6": ">=7.29.6 <8"
  "ws@>=8 <8.21.0": ">=8.21.0 <9"
  "ws@>=7 <7.5.11": ">=7.5.11 <8"
  "form-data@>=4 <4.0.6": ">=4.0.6 <5"
  "defu@<6.1.5": ">=6.1.5 <7"
  "path-to-regexp@>=8 <8.4.0": ">=8.4.0 <9"
  "picomatch@<2.3.2": ">=2.3.2 <3"
  "ajv@>=6 <6.14.0": ">=6.14.0 <7"
  "diff@>=4.0.0 <4.0.4": ">=4.0.4 <5"

# Local fixes for advisories with no usable upstream release. Each patch file
# says what it changes; drop the entry once the dependency ships the fix.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  glob@10.5.0: patches/glob@10.5.0.patch
  glob@13.0.6: patches/glob@13.0.6.patch

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
